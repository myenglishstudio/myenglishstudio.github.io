      context: "Phone A's battery lasts 24 hours. Phone B's battery lasts 12 hours.",
      keyword: "LONGER",
      answers: [
        "Phone A lasts 12 hours longer than Phone B.",
        "Phone A's battery lasts 12 hours longer than Phone B's."
      ]
    },
    {
      category: "Technology",
      context: "Monitor 1 has a 27-inch screen. Monitor 2 has a 24-inch screen.",
      keyword: "LARGER",
      answers: [
        "Monitor 1 is 3 inches larger than Monitor 2.",
        "Monitor 1 is 3 inches bigger than Monitor 2."
      ]
    },
    {
      category: "Technology",
      context: "Drive A has 512 GB of storage. Drive B has 256 GB.",
      keyword: "LARGER",
      answers: [
        "Drive A is 256 GB larger than Drive B.",
        "Drive A is 256GB larger than Drive B."
      ]
    },

    // --- DEPTH & AREA ---
    {
      category: "Depth & Area",
      context: "The swimming pool is 3 meters deep. The diving pool is 6 meters deep.",
      keyword: "DEEPER",
      answers: [
        "The diving pool is 3 meters deeper than the swimming pool.",
        "The diving pool is twice as deep as the swimming pool."
      ]
    },
    {
      category: "Depth & Area",
      context: "Apartment 1 is 80 square meters. Apartment 2 is 120 square meters.",
      keyword: "SPACIOUS",
      answers: [
        "Apartment 2 is more spacious than Apartment 1.",
        "Apartment 2 is 40 square meters more spacious than Apartment 1."
      ]
    },

    // --- FREQUENCY & ATTENDANCE ---
    {
      category: "Frequency",
      context: "Lisa visits the gym 4 times a week. Karen visits the gym 2 times a week.",
      keyword: "OFTEN",
      answers: [
        "Lisa goes to the gym twice as often as Karen.",
        "Lisa visits the gym twice as often as Karen."
      ]
    },
    {
      category: "Frequency",
      context: "The express bus arrives every 10 minutes. The regular bus arrives every 30 minutes.",
      keyword: "FREQUENT",
      answers: [
        "The express bus is three times more frequent than the regular bus.",
        "The express bus is much more frequent than the regular bus."
      ]
    },

    // --- ENERGY & POWER ---
    {
      category: "Energy",
      context: "Bulb A uses 10 Watts. Bulb B uses 60 Watts.",
      keyword: "EFFICIENT",
      answers: [
        "Bulb A is much more energy efficient than Bulb B.",
        "Bulb A is six times more efficient than Bulb B.",
        "Bulb A is far more efficient than Bulb B."
      ]
    },
    {
      category: "Sound & Noise",
      context: "The whisper measured 30 decibels. The shouting measured 80 decibels.",
      keyword: "LOUDER",
      answers: [
        "The shouting was 50 decibels louder than the whisper.",
        "The shouting was 50 dB louder than the whisper."
      ]
    },
    {
      category: "Weight / Cargo",
      context: "Truck A carries 5 tons of cargo. Truck B carries 2 tons of cargo.",
      keyword: "MORE",
      answers: [
        "Truck A carries 3 tons more cargo than Truck B.",
        "Truck A carries 3 more tons than Truck B."
      ]
    },
    {
      category: "Reading & Pages",
      context: "Book 1 has 400 pages. Book 2 has 200 pages.",
      keyword: "LONGER",
      answers: [
        "Book 1 is 200 pages longer than Book 2.",
        "Book 1 has 200 pages more than Book 2."
      ]
    }
  ];

  // --- STATE VARIABLES ---
  let isWelcome = true;
  let currentIndex = 0;
  let score = 0;
  let hasSubmitted = false;

  function normalizeText(str) {
    return str
      .toLowerCase()
      .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?"']/g, "")
      .replace(/\s+/g, " ")
      .trim();
  }

  function updateHeader() {
    if (isWelcome) {
      document.getElementById("counter-badge").innerText = "Instructions & Examples";
      document.getElementById("score-badge").innerText = "Score: 0";
      document.getElementById("progress-bar").style.width = "0%";
    } else {
      document.getElementById("counter-badge").innerText = `Question ${currentIndex + 1} / ${dataset.length}`;
      document.getElementById("score-badge").innerText = `Score: ${score}`;
      const pct = (currentIndex / dataset.length) * 100;
      document.getElementById("progress-bar").style.width = `${pct}%`;
    }
  }

  function renderWelcome() {
    isWelcome = true;
    updateHeader();

    const container = document.getElementById("viewport");
    container.innerHTML = `
      <div class="welcome-card">
        <span class="welcome-badge">Task Guide & Walkthrough</span>
        <h1 class="welcome-title">How to Complete This Task</h1>

        <div class="rules-list">
          <h3>📌 Instructions</h3>
          <ul>
            <li><strong>Analyze the Facts:</strong> Read the two sentences comparing age, height, distance, price, speed, weight, etc.</li>
            <li><strong>Stick to the Formula:</strong> Your answer MUST follow the structure:<br>
                <div style="margin: 8px 0; padding: 8px 12px; background: white; border-left: 4px solid var(--khaki-dark); font-weight: 700; color: var(--khaki-dark); border-radius: 4px;">
                  [Number / Difference with Unit] + [Comparative Adjective] + than + [Noun / Pronoun]
                </div>
            </li>
            <li><strong>Calculate the Exact Difference:</strong> Subtract to find the exact difference (e.g., <em>5 years</em>, <em>15 cm</em>, <em>$80</em>, <em>40 km/h</em>, <em>45 minutes</em>).</li>
            <li><strong>Keep the Keyword:</strong> Always include the exact comparative keyword provided.</li>
          </ul>
        </div>

        <div class="examples-grid">
          <div class="example-box">
            <span class="example-tag">Example 1 (Difference)</span>
            <div class="example-line"><strong>Context:</strong> "I am 10 years old. My brother is 15 years old."</div>
            <div class="example-line"><strong>Keyword:</strong> <span style="background: var(--khaki-dark); color: white; padding: 2px 8px; border-radius: 6px; font-weight: 700; font-size: 12px;">OLDER</span></div>
            <div class="example-result">➔ "My brother is 5 years older than me."</div>
          </div>

          <div class="example-box">
            <span class="example-tag">Example 2 (Measurement Difference)</span>
            <div class="example-line"><strong>Context:</strong> "Tower A is 300 meters high. Tower B is 150 meters high."</div>
            <div class="example-line"><strong>Keyword:</strong> <span style="background: var(--khaki-dark); color: white; padding: 2px 8px; border-radius: 6px; font-weight: 700; font-size: 12px;">TALLER</span></div>
            <div class="example-result">➔ "Tower A is 150 meters taller than Tower B."</div>
          </div>
        </div>

        <button class="btn btn-primary" style="width: 100%;" onclick="startExercise()">
          I Understand — Start Quiz (45 Questions) ➔
        </button>
      </div>
    `;
  }

  function startExercise() {
    isWelcome = false;
    currentIndex = 0;
    score = 0;
    renderQuestion();
  }

  function renderQuestion() {
    if (currentIndex >= dataset.length) {
      renderFinale();
      return;
    }

    hasSubmitted = false;
    updateHeader();

    const item = dataset[currentIndex];
    const container = document.getElementById("viewport");

    container.innerHTML = `
      <span class="category-pill">${item.category}</span>
      
      <div class="context-box">
        <div class="context-label">Original Context</div>
        <div class="context-text">"${item.context}"</div>
      </div>

      <div class="keyword-container">
        <span class="keyword-label">Required Key Word:</span>
        <span class="keyword-pill">${item.keyword}</span>
      </div>

      <div class="input-wrapper">
        <input 
          type="text" 
          id="user-input" 
          class="text-input" 
          placeholder="Type your comparative paraphrase here..." 
          autocomplete="off"
          spellcheck="false"
        />
      </div>

      <div id="feedback-box" class="feedback-card"></div>

      <div class="action-row">
        <button class="btn btn-outline" onclick="revealModelAnswer()">💡 Show Answer</button>
        <button class="btn btn-primary" id="submit-btn" onclick="checkAnswer()">Submit Paraphrase ➔</button>
      </div>
    `;

    const inputEl = document.getElementById("user-input");
    inputEl.focus();
    inputEl.addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        if (!hasSubmitted) {
          checkAnswer();
        } else {
          nextQuestion();
        }
      }
    });
  }

  function checkAnswer() {
    const inputEl = document.getElementById("user-input");
    const userVal = inputEl.value.trim();
    if (!userVal) {
      inputEl.focus();
      return;
    }

    const item = dataset[currentIndex];
    const normalizedUser = normalizeText(userVal);
    const requiredWord = item.keyword.toLowerCase();

    const includesKeyword = normalizedUser.split(" ").some(word => word.startsWith(requiredWord));
    let isMatched = item.answers.some(ans => normalizeText(ans) === normalizedUser);

    const feedbackBox = document.getElementById("feedback-box");
    const submitBtn = document.getElementById("submit-btn");
    const appCard = document.getElementById("app-card");

    if (isMatched && includesKeyword) {
      score++;
      document.body.classList.add("flash-green");
      appCard.classList.add("card-pulse-green");

      feedbackBox.className = "feedback-card correct";
      feedbackBox.innerHTML = `
        <strong>✨ Spot on! Excellent comparative paraphrase.</strong>
        <div style="margin-top: 6px;">Your sentence: <em>"${userVal}"</em></div>
      `;
      feedbackBox.style.display = "block";

      setTimeout(() => {
        document.body.classList.remove("flash-green");
        appCard.classList.remove("card-pulse-green");
      }, 450);

    } else {
      document.body.classList.add("flash-red");
      appCard.classList.add("card-pulse-red");

      let extraTip = "";
      if (!includesKeyword) {
        extraTip = `<p style="margin-top: 4px; color: var(--terracotta);"><strong>Reminder:</strong> Make sure you include the required keyword: <strong>${item.keyword}</strong>.</p>`;
      }

      feedbackBox.className = "feedback-card incorrect";
      feedbackBox.innerHTML = `
        <strong>Not quite exact!</strong> ${extraTip}
        <div style="margin-top: 6px;">Accepted model ways to express this:</div>
        <ul class="sample-answers-list">
          ${item.answers.map(a => `<li>${a}</li>`).join("")}
        </ul>
      `;
      feedbackBox.style.display = "block";

      setTimeout(() => {
        document.body.classList.remove("flash-red");
        appCard.classList.remove("card-pulse-red");
      }, 450);
    }

    hasSubmitted = true;
    inputEl.disabled = true;
    submitBtn.innerText = "Next Question ➔";
    submitBtn.className = "btn btn-primary";
    submitBtn.onclick = nextQuestion;
    submitBtn.focus();
  }

  function revealModelAnswer() {
    const item = dataset[currentIndex];
    const feedbackBox = document.getElementById("feedback-box");
    feedbackBox.className = "feedback-card correct";
    feedbackBox.innerHTML = `
      <strong>💡 Model Paraphrases:</strong>
      <ul class="sample-answers-list">
        ${item.answers.map(a => `<li>${a}</li>`).join("")}
      </ul>
    `;
    feedbackBox.style.display = "block";
    hasSubmitted = true;
    const submitBtn = document.getElementById("submit-btn");
    submitBtn.innerText = "Next Question ➔";
    submitBtn.onclick = nextQuestion;
  }

  function nextQuestion() {
    currentIndex++;
    renderQuestion();
  }

  function renderFinale() {
    document.getElementById("progress-bar").style.width = "100%";
    const container = document.getElementById("viewport");
    const accuracy = Math.round((score / dataset.length) * 100);

    container.innerHTML = `
      <div class="finale-box">
        <div class="finale-trophy">🏆</div>
        <h2 class="finale-title">Paraphrase Mastery Completed!</h2>
        <p class="finale-desc">You have successfully transformed and compared 45 complex quantitative contexts across age, distance, weight, height, speed, cost, and time!</p>

        <div class="score-summary-grid">
          <div class="score-box">
            <div class="num">${score}</div>
            <div class="label">Correct</div>
          </div>
          <div class="score-box">
            <div class="num">${dataset.length - score}</div>
            <div class="label">Missed</div>
          </div>
          <div class="score-box">
            <div class="num">${accuracy}%</div>
            <div class="label">Accuracy</div>
          </div>
        </div>

        <button class="btn btn-primary" style="margin: 0 auto; max-width: 260px;" onclick="renderWelcome()">Review Instructions & Restart 🔄</button>
      </div>
    `;
  }

  // Initial Boot
  renderWelcome();
</script>

</body>
</html>
