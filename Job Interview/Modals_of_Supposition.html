            margin: 0 4px;
            vertical-align: middle;
        }

            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .card-footer {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }

        button.check-btn {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 8px 22px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(37, 99, 235, 0.3);

        }

        button.check-btn:hover {
            background: linear-gradient(135deg, #1d4ed8, #1e40af);
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.4);
        }

        button.check-btn:active {
            transform: translateY(0);
        }

        .feedback {
            margin-top: 16px;
            padding: 14px 18px;
            border-radius: 12px;
            display: none;
            font-size: 0.95rem;
            animation: fadeIn 0.3s ease-in-out;
        }

            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback.correct {
            background-color: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .feedback.incorrect {
            background-color: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .explanation {
            margin-top: 6px;
            font-size: 0.9rem;
            color: #334155;
            line-height: 1.5;
        }

            .sentence-flow {
                line-height: 2.8rem;
            }

        }

                    <div class="card-footer">
                        <button class="check-btn" onclick="checkAnswer(${q.id})">Check</button>
                    </div>
                    <div class="feedback" id="feedback-${q.id}"></div>

                container.appendChild(card);

            if (userVal === "") {
                feedback.className = "feedback incorrect";
                feedback.style.display = "block";
                feedback.innerHTML = `<strong>Please enter an answer first!</strong>`;
                return;
            }

            const isCorrect = q.answers.includes(userVal);

            feedback.style.display = "block";
            
            if (isCorrect) {
                feedback.className = "feedback correct";
                feedback.innerHTML = `<strong>Correct! 🎉</strong><div class="explanation">${q.explanation}</div>`;
                
                if (!checkedQuestions.has(id)) {
                    score++;
                    checkedQuestions.add(id);
                    document.getElementById('score').innerText = score;
                }
            } else {
                feedback.className = "feedback incorrect";
                feedback.innerHTML = `
                    <strong>Not quite!</strong> Accepted answer(s): <u>${q.answers.join(" / ")}</u>
                    <div class="explanation">${q.explanation}</div>
                `;
                
                if (checkedQuestions.has(id)) {
                    score--;
                    checkedQuestions.delete(id);
                    document.getElementById('score').innerText = score;
                }
            }
        }

        window.onload = renderQuiz;
    </script>
</body>
</html>
