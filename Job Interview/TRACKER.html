<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Data Analyst Interview Prep Tracker</title>
<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        color: #f1f5f9;
        line-height: 1.6;
        margin: 0;
        padding: 20px;
        touch-action: manipulation;
        background: linear-gradient(rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.9)),
                    url('https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat fixed;
        min-height: 100vh;
    }
    .container {
        max-width: 1050px;
        margin: 0 auto;
        background: rgba(30, 41, 59, 0.95);
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        border: 1px solid #334155;
    }
    h1 {
        text-align: center;
        color: #38bdf8;
        font-size: 26px;
        margin-top: 0;
        margin-bottom: 5px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    p.subtitle {
        text-align: center;
        color: #94a3b8;
        margin-bottom: 25px;
        font-size: 15px;
    }

    /* Controls Bar */
    .controls-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        gap: 10px;
        flex-wrap: wrap;
    }
    .add-btn {
        background: #0284c7;
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
    }
    .add-btn:hover {
        background: #0369a1;
        transform: translateY(-1px);
    }

    /* Table Styles */
    .table-wrapper {
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        border-radius: 10px;
        border: 1px solid #334155;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
        background-color: #0f172a;
    }
    th {
        background-color: #1e293b;
        color: #38bdf8;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 16px;
        border-bottom: 2px solid #334155;
    }
    th.col-date { width: 18%; }
    th.col-task { width: 38%; }
    th.col-feedback { width: 38%; }
    th.col-actions { width: 6%; text-align: center; }

    td {
        padding: 14px 16px;
        border-bottom: 1px solid #1e293b;
        vertical-align: top;
        font-size: 15px;
        color: #e2e8f0;
    }
    tr:last-child td {
        border-bottom: none;
    }

    /* Inputs inside Table */
    input[type="date"], textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #334155;
        border-radius: 6px;
        background-color: #1e293b;
        color: #f8fafc;
        font-size: 14px;
        font-family: inherit;
        resize: vertical;
        transition: border-color 0.2s;
    }
    input[type="date"]:focus, textarea:focus {
        outline: none;
        border-color: #38bdf8;
        box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }
    textarea {
        min-height: 80px;
    }

    .btn-delete {
        background: transparent;
        border: 1px solid #475569;
        color: #94a3b8;
        padding: 6px 10px;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s;
    }
    .btn-delete:hover {
        color: #f87171;
        border-color: #f87171;
        background: rgba(248, 113, 113, 0.1);
    }
</style>
</head>
<body>

<div class="container">
    <h1>Data Analyst Interview Prep</h1>
    <p class="subtitle">Student Preparation Progress & Editable Feedback Tracker</p>

    <div class="controls-bar">
        <button class="add-btn" onclick="addNewRow()">+ Add New Entry</button>
    </div>

    <div class="table-wrapper">
        <table id="trackerTable">
            <thead>
                <tr>
                    <th class="col-date">Date</th>
                    <th class="col-task">Task / Topic</th>
                    <th class="col-feedback">Feedback & Notes</th>
                    <th class="col-actions"></th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Editable Row 1 -->
                <tr>
                    <td>
                        <input type="date" value="2026-09-10">
                    </td>
                    <td>
                        <textarea placeholder="Task details...">SQL Window Functions Practice: Solved 5 LeetCode Medium queries using ROW_NUMBER(), RANK(), and DENSE_RANK().</textarea>
                    </td>
                    <td>
                        <textarea placeholder="Your feedback...">Good logic structure. Needs to review performance optimization when joining large CTEs before applying window functions.</textarea>
                    </td>
                    <td style="text-align: center;">
                        <button class="btn-delete" onclick="deleteRow(this)" title="Delete row">✕</button>
                    </td>
                </tr>
                <!-- Editable Row 2 -->
                <tr>
                    <td>
                        <input type="date" value="2026-09-12">
                    </td>
                    <td>
                        <textarea placeholder="Task details...">Business Case Study Mock: Analyzed an e-commerce user churn scenario and defined key KPIs (CAC, LTV, Retention Rate).</textarea>
                    </td>
                    <td>
                        <textarea placeholder="Your feedback...">Strong metric selection. Work on articulating the "so what?" business impact more clearly during the opening summary.</textarea>
                    </td>
                    <td style="text-align: center;">
                        <button class="btn-delete" onclick="deleteRow(this)" title="Delete row">✕</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    function addNewRow() {
        const tbody = document.getElementById("tableBody");
        const today = new Date().toISOString().split('T')[0];

        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td>
                <input type="date" value="${today}">
            </td>
            <td>
                <textarea placeholder="e.g., Solved 3 SQL Joins, Prepared Product Sense Qs..."></textarea>
            </td>
            <td>
                <textarea placeholder="e.g., Needs to explain trade-offs faster, good STAR response..."></textarea>
            </td>
            <td style="text-align: center;">
                <button class="btn-delete" onclick="deleteRow(this)" title="Delete row">✕</button>
            </td>
        `;

        tbody.prepend(tr); // Adds new editable row to the top
    }

    function deleteRow(btn) {
        const tr = btn.closest("tr");
        tr.remove();
    }
</script>

</body>
</html>
