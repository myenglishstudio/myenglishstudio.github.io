<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khaki Nordic Phrasal Verb Mastery - Business & IT</title>
  <style>
    /* --- KHAKI & WARM EARTH SCANDINAVIAN PALETTE --- */
    :root {
      --bg-khaki-bone: #F7F6EE;
      --card-bg: #FFFFFF;
      --slate-dark: #2C3531;
      --slate-muted: #5C6B66;
      
      /* Khaki Palette */
      --khaki-dark: #585131;        /* Deep khaki accent */
      --khaki-sage: #80774D;        /* Warm khaki sage */
      --khaki-light: #ECE8D9;       /* Light warm khaki background fill */
      --khaki-border: #D8D2BC;      /* Border tone */

      /* Feedback Colors */
      --flash-green-bg: #22C55E;
      --flash-green-glow: rgba(34, 197, 94, 0.4);
      --flash-red-bg: #EF4444;
      --flash-red-glow: rgba(239, 68, 68, 0.4);

      --terracotta: #D96B52;
      --soft-red: #FEE2E2;
      --radius-lg: 20px;
      --radius-md: 14px;
      --shadow-sm: 0 4px 12px rgba(0,0,0,0.03);
      --shadow-md: 0 10px 30px rgba(0,0,0,0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-khaki-bone);
      color: var(--slate-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
      transition: background-color 0.25s ease, box-shadow 0.25s ease;
      box-shadow: inset 0 0 0 0 transparent;
    }

    /* Full-viewport Flash States */
    body.flash-green { 
      background-color: #DCFCE7 !important;
      box-shadow: inset 0 0 120px var(--flash-green-bg) !important;
    }
    
    body.flash-red { 
      background-color: #FEE2E2 !important;
      box-shadow: inset 0 0 120px var(--flash-red-bg) !important;
    }

    /* CONTAINER */
    .app-container {
      width: 100%;
      max-width: 980px;
      background-color: var(--card-bg);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--khaki-border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .app-container.card-pulse-green {
      border-color: var(--flash-green-bg) !important;
      box-shadow: 0 0 35px var(--flash-green-glow) !important;
      transform: scale(1.005);
    }

    .app-container.card-pulse-red {
      border-color: var(--flash-red-bg) !important;
      box-shadow: 0 0 35px var(--flash-red-glow) !important;
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    /* BOTANICAL PROGRESS HEADER */
    .progress-header {
      padding: 22px 28px;
      background: var(--khaki-light);
      border-bottom: 1px solid var(--khaki-border);
      display: none; /* Shown after welcome screen */
    }

    .stages-container {
      display: flex;
      justify-content: space-between;
      position: relative;
    }

    .stages-container::before {
      content: '';
      position: absolute;
      top: 20px;
      left: 30px;
      right: 30px;
      height: 3px;
      background-color: #D1CCA9;
      z-index: 1;
    }

    .stage-item {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      opacity: 0.35;
      transition: all 0.3s ease;
      cursor: not-allowed;
    }

    .stage-item.unlocked {
      opacity: 0.75;
      cursor: pointer;
    }

    .stage-item.unlocked:hover {
      opacity: 1.0;
      transform: translateY(-2px);
    }

    .stage-item.active {
      opacity: 1.0;
      transform: scale(1.06);
      cursor: default;
    }

    .stage-item.completed { opacity: 0.9; }

    .icon-circle {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: white;
      border: 2px solid #D1CCA9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .stage-item.active .icon-circle {
      border-color: var(--khaki-sage);
      background-color: var(--bg-khaki-bone);
    }

    .stage-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--khaki-dark);
    }

    /* NAVIGATION BAR */
    .task-nav-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .btn-nav {
      background: transparent;
      border: 1px solid var(--khaki-border);
      color: var(--khaki-dark);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-nav:hover {
      background-color: var(--khaki-light);
      border-color: var(--khaki-sage);
    }

    /* CONTENT VIEWPORT */
    .task-content {
      padding: 40px 48px;
      min-height: 560px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .task-title {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--slate-dark);
      text-align: center;
    }

    .task-instruction {
      font-size: 15px;
      color: var(--slate-muted);
      margin-bottom: 28px;
      text-align: center;
      max-width: 720px;
      line-height: 1.6;
    }

    .progress-tracker-text {
      font-size: 14px;
      font-weight: 700;
      color: var(--khaki-dark);
      margin-bottom: 16px;
    }

    /* WELCOME SCREEN STYLING */
    .welcome-hero {
      text-align: center;
      max-width: 800px;
    }

    .welcome-badge {
      display: inline-block;
      background-color: var(--khaki-light);
      color: var(--khaki-dark);
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 18px;
      border: 1px solid var(--khaki-border);
    }

    .welcome-title {
      font-size: 36px;
      font-weight: 800;
      color: var(--slate-dark);
      line-height: 1.25;
      margin-bottom: 18px;
    }

    .welcome-desc {
      font-size: 16px;
      color: var(--slate-muted);
      line-height: 1.6;
      margin-bottom: 36px;
    }

    .benefits-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 40px;
      text-align: left;
    }

    .benefit-card {
      background: var(--bg-khaki-bone);
      border: 1px solid var(--khaki-border);
      border-radius: var(--radius-md);
      padding: 22px;
      display: flex;
      flex-direction: column;
      height: 250px;
      justify-content: flex-start;
    }

    .benefit-img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: var(--radius-md);
      margin-bottom: 12px;
      border: 1px solid var(--khaki-border);
    }

    .benefit-card h4 {
      font-size: 16px;
      color: var(--khaki-dark);
      margin-bottom: 6px;
    }

    .benefit-card p {
      font-size: 13px;
      color: var(--slate-muted);
      line-height: 1.4;
    }

    .btn-cta-primary {
      background-color: var(--khaki-dark);
      color: white;
      border: none;
      padding: 18px 44px;
      font-size: 17px;
      font-weight: 700;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(88, 81, 49, 0.25);
      transition: all 0.25s ease;
      position: relative;
      z-index: 10;
    }

    .btn-cta-primary:hover {
      background-color: #403B23;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(88, 81, 49, 0.35);
    }

    /* LARGE FULL-SCREEN FLASHCARDS FOR TASK 0 */
    .large-flashcards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      width: 100%;
      margin-bottom: 36px;
    }

    .flip-card-large {
      background-color: transparent;
      height: 220px;
      perspective: 1000px;
      cursor: pointer;
    }

    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
    }

    .flip-card-large.flipped .flip-card-inner {
      transform: rotateY(180deg);
    }

    .flip-card-front, .flip-card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: var(--radius-md);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px;
      box-shadow: var(--shadow-sm);
    }

    .flip-card-front {
      background-color: white;
      border: 2px solid var(--khaki-border);
      color: var(--khaki-dark);
    }

    .flip-card-front strong {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--khaki-dark);
      background: var(--khaki-light);
      padding: 6px 16px;
      border-radius: 8px;
      border: 1px solid var(--khaki-border);
    }

    .flip-card-front .tap-hint {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--slate-muted);
      margin-top: 14px;
      font-weight: 600;
    }

    .flip-card-back {
      background-color: var(--khaki-light);
      border: 2px solid var(--khaki-sage);
      color: var(--slate-dark);
      transform: rotateY(180deg);
      font-size: 12px;
      line-height: 1.4;
      text-align: center;
      justify-content: space-around;
    }

    .flip-card-back strong {
      color: var(--khaki-dark);
      font-size: 14px;
    }

    .flip-card-back .dict-def {
      font-style: italic;
      color: #3B443F;
    }

    .flip-card-back .context-box {
      background: rgba(255, 255, 255, 0.7);
      border-left: 3px solid var(--khaki-sage);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      color: var(--slate-dark);
      text-align: left;
      width: 100%;
    }

    .flip-card-back .context-box b {
      color: var(--khaki-dark);
    }

    /* TASK 1: MATCHING */
    .matching-columns {
      display: flex;
      gap: 20px;
      width: 100%;
    }

    .col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .col-header {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--khaki-dark);
      text-align: center;
      margin-bottom: 4px;
    }

    .card {
      background: var(--bg-khaki-bone);
      border: 1px solid var(--khaki-border);
      border-radius: var(--radius-md);
      padding: 14px;
      text-align: center;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card:hover { 
      border-color: var(--khaki-sage);
      background-color: var(--khaki-light);
    }

    .card.selected {
      background: var(--khaki-dark);
      color: white;
      border-color: var(--khaki-dark);
    }

    .card.matched {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    /* TASK 2 & 3: SENTENCE BOX & SELECTION CHIPS */
    .sentence-box {
      background: var(--bg-khaki-bone);
      padding: 28px;
      border-radius: var(--radius-md);
      font-size: 19px;
      line-height: 1.5;
      text-align: center;
      width: 100%;
      margin-bottom: 28px;
      border: 1px solid var(--khaki-border);
      box-shadow: var(--shadow-sm);
    }

    .chip-container {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      width: 100%;
    }

    .chip-btn {
      background-color: var(--khaki-light);
      color: var(--slate-dark);
      border: 1px solid var(--khaki-border);
      border-radius: 24px;
      padding: 12px 24px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .chip-btn:hover {
      background-color: var(--khaki-sage);
      color: white;
      border-color: var(--khaki-sage);
      transform: translateY(-2px);
    }

    /* TASK 4: BINARY BUTTONS & EXPLANATIONS */
    .binary-buttons {
      display: flex;
      gap: 20px;
      width: 100%;
    }

    .btn-val {
      flex: 1;
      padding: 18px;
      border-radius: var(--radius-md);
      border: none;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      color: white;
      transition: transform 0.1s;
    }

    .btn-val:active { transform: scale(0.97); }
    .btn-correct { background-color: var(--khaki-sage); }
    .btn-incorrect { background-color: var(--terracotta); }

    .explanation-card {
      width: 100%;
      background-color: #FEF2F2;
      border: 2px solid var(--flash-red-bg);
      color: #991B1B;
      border-radius: var(--radius-md);
      padding: 18px;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.5;
      margin-top: 20px;
      display: none;
      text-align: center;
    }

    /* TASK 5: PRODUCTION & MULTIPLE SAMPLE ANSWERS */
    .input-box {
      width: 100%;
      padding: 16px;
      border: 1px solid var(--khaki-border);
      border-radius: var(--radius-md);
      font-size: 16px;
      margin-bottom: 14px;
    }

    .sample-answer-card {
      width: 100%;
      background-color: var(--khaki-light);
      border: 1px dashed var(--khaki-sage);
      border-radius: var(--radius-md);
      padding: 18px 22px;
      font-size: 14px;
      color: var(--slate-dark);
      margin-bottom: 20px;
      display: none;
      line-height: 1.6;
      text-align: left;
    }

    .sample-answer-card ul {
      margin-top: 8px;
      padding-left: 20px;
    }

    .sample-answer-card li {
      margin-bottom: 8px;
    }

    .sample-answer-card li:last-child {
      margin-bottom: 0;
    }

    .action-row {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .btn-action {
      flex: 1;
      padding: 14px;
      border-radius: var(--radius-md);
      border: none;
      font-weight: 600;
      cursor: pointer;
      font-size: 15px;
    }

    .btn-secondary { background-color: var(--khaki-light); color: var(--slate-dark); }
    .btn-primary { background-color: var(--khaki-dark); color: white; }

    /* MILESTONE / REWARD SCREEN STYLING */
    .milestone-card {
      text-align: center;
      max-width: 680px;
      padding: 20px 10px;
    }

    .milestone-icon {
      font-size: 90px;
      margin: 10px 0 20px 0;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.3); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .milestone-badge {
      display: inline-block;
      background-color: var(--khaki-light);
      color: var(--khaki-dark);
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      border: 1px solid var(--khaki-border);
    }

    .milestone-quote {
      font-size: 16px;
      line-height: 1.6;
      color: var(--slate-dark);
      background-color: var(--bg-khaki-bone);
      padding: 22px;
      border-radius: var(--radius-md);
      border-left: 5px solid var(--khaki-dark);
      margin: 24px 0 32px 0;
      text-align: left;
    }

    /* FINALE STYLING */
    .finale-card {
      text-align: center;
      padding: 10px;
      max-width: 820px;
    }

    .finale-img {
      width: 100%;
      max-height: 320px;
      object-fit: cover;
      border-radius: var(--radius-md);
      border: 1px solid var(--khaki-border);
      margin: 18px 0;
      box-shadow: var(--shadow-sm);
    }

    .finale-quote {
      font-size: 17px;
      line-height: 1.6;
      color: var(--slate-dark);
      background-color: var(--khaki-light);
      padding: 24px;
      border-radius: var(--radius-md);
      border-left: 5px solid var(--khaki-dark);
      margin-top: 18px;
      text-align: left;
    }
  </style>
</head>
<body>

<div class="app-container" id="app-card">
  <!-- BOTANICAL PROGRESS HEADER -->
  <div class="progress-header" id="progress-header">
    <div class="stages-container">
      <div class="stage-item active unlocked" id="stage-0" onclick="jumpToTask(0)">
        <div class="icon-circle">🌱</div>
        <span class="stage-label">Soil</span>
      </div>
      <div class="stage-item" id="stage-1" onclick="jumpToTask(1)">
        <div class="icon-circle">🌱</div>
        <span class="stage-label">Seed</span>
      </div>
      <div class="stage-item" id="stage-2" onclick="jumpToTask(2)">
        <div class="icon-circle">🌿</div>
        <span class="stage-label">Sprout</span>
      </div>
      <div class="stage-item" id="stage-3" onclick="jumpToTask(3)">
        <div class="icon-circle">🪴</div>
        <span class="stage-label">Growing</span>
      </div>
      <div class="stage-item" id="stage-4" onclick="jumpToTask(4)">
        <div class="icon-circle">🌳</div>
        <span class="stage-label">Tree</span>
      </div>
      <div class="stage-item" id="stage-5" onclick="jumpToTask(5)">
        <div class="icon-circle">🍎</div>
        <span class="stage-label">Fruit</span>
      </div>
    </div>
  </div>

  <!-- MAIN TASK VIEWPORT -->
  <div class="task-content" id="task-container">
    <!-- Rendered dynamically -->
  </div>
</div>

<script>
  // --- DATASETS ---

  const matchingPairs = [
    { 
      verb: "jump on", 
      synonym: "join / attend",
      oxfordDef: "To join or participate eagerly in an activity or communication channel.",
      context: "Can everyone <b>jump on</b> the sync call to review the urgent fix?"
    },
    { 
      verb: "kick off", 
      synonym: "begin / start",
      oxfordDef: "To start an event, meeting, discussion, or activity.",
      context: "Let's <b>kick off</b> today's sprint planning with a quick demo."
    },
    { 
      verb: "get into", 
      synonym: "discuss / start discussing",
      oxfordDef: "To start discussing, examining, or becoming involved in a particular subject.",
      context: "We'll <b>get into</b> the cloud architecture in the second half of the deck."
    },
    { 
      verb: "set out", 
      synonym: "outline / explain",
      oxfordDef: "To present, explain, or outline facts, plans, or reasons clearly in detail.",
      context: "The tech lead <b>set out</b> clear guidelines for API security."
    },
    { 
      verb: "map out", 
      synonym: "plan in detail",
      oxfordDef: "To plan or arrange the details of something carefully and systematically.",
      context: "We need to <b>map out</b> our release roadmap before Q3 starts."
    },
    { 
      verb: "come out", 
      synonym: "be released / launch",
      oxfordDef: "To become available to the public; to be published, launched, or made public.",
      context: "Version 2.0 of our platform is scheduled to <b>come out</b> next month."
    },
    { 
      verb: "get through", 
      synonym: "cover / complete",
      oxfordDef: "To complete or deal with a task, a list of items, or a period of work.",
      context: "Did you manage to <b>get through</b> all 15 bug reports today?"
    },
    { 
      verb: "set aside", 
      synonym: "reserve",
      oxfordDef: "To save, reserve, or keep time or money available for a specific purpose.",
      context: "Please <b>set aside</b> two hours tomorrow for deep code review."
    },
    { 
      verb: "talk through", 
      synonym: "discuss carefully",
      oxfordDef: "To discuss something thoroughly in order to reach an agreement or understanding.",
      context: "Let's sit down and <b>talk through</b> the outage incident step by step."
    }
  ];

  const task2Sentences = [
    { text: "Thanks everyone for jumping ... the emergency Zoom call.", answer: "on" },
    { text: "Let's kick things ... with a quick status report from DevOps.", answer: "off" },
    { text: "We will get ... the backend architecture during the second half.", answer: "into" },
    { text: "The lead architect set ... the guidelines for the new API.", answer: "out" },
    { text: "We mapped ... the sprint schedule for the entire quarter.", answer: "out" },
    { text: "The security patch is coming ... at midnight tonight.", answer: "out" },
    { text: "Can we get ... all 15 bug reports before the standup ends?", answer: "through" },
    { text: "Please set ... two hours for code review tomorrow.", answer: "aside" },
    { text: "Let's talk things ... with product design before pushing changes.", answer: "through" },
    { text: "More developers jumped ... the open-source project this week.", answer: "on" },
    { text: "The keynote speaker kicked ... the conference with a demo.", answer: "off" },
    { text: "Once we finish setup, we can get ... performance tuning.", answer: "into" },
    { text: "This deck sets ... our cloud migration plan.", answer: "out" },
    { text: "They mapped ... the database schema on the whiteboard.", answer: "out" },
    { text: "Version 2.0 will come ... after QA completes testing.", answer: "out" },
    { text: "Did you manage to get ... the automated test suite?", answer: "through" },
    { text: "We need to set ... extra server budget for high traffic.", answer: "aside" },
    { text: "We sat down to talk ... the outage incident step by step.", answer: "through" },
    { text: "I'll jump ... the client call as soon as my build finishes.", answer: "on" },
    { text: "Let's kick ... the meeting by reviewing the pull requests.", answer: "off" }

  }

  function handleT1SynClick(idx) {
    if (window.t1Synonyms[idx].matched) return;
    t1SelectedSyn = idx;
    checkT1Match();
    renderTask();
  }

  function checkT1Match() {
    if (t1SelectedVerb !== null && t1SelectedSyn !== null) {
      const verbObj = window.t1Verbs[t1SelectedVerb];
      const synObj = window.t1Synonyms[t1SelectedSyn];

      if (verbObj.id === synObj.id) {
        verbObj.matched = true;
        synObj.matched = true;
        t1MatchesLeft--;
        if (t1MatchesLeft === 0) {
          setTimeout(() => { triggerMilestone(1); }, 400);
        }
      } else {
        // MISTAKE HANDLER FOR TASK 1
        t1Lives--;
        const appCard = document.getElementById('app-card');
        document.body.classList.add('flash-red');
        appCard.classList.add('card-pulse-red');

        setTimeout(() => {
          document.body.classList.remove('flash-red');
          appCard.classList.remove('card-pulse-red');
        }, 450);

        if (t1Lives <= 0) {
          setTimeout(() => {
            alert("You have run out of attempts! Task 1 will start anew.");
            resetCurrentTask();
          }, 500);
        }
      }
      t1SelectedVerb = null;
      t1SelectedSyn = null;
    }
  }

  function handleT2Choice(choice) {
    if (choice === task2Sentences[t2Index].answer) {
      t2Index++;
      renderTask();
    } else {
      // MISTAKE HANDLER FOR TASK 2
      t2Lives--;
      const appCard = document.getElementById('app-card');
      document.body.classList.add('flash-red');
      appCard.classList.add('card-pulse-red');

      setTimeout(() => {
        document.body.classList.remove('flash-red');
        appCard.classList.remove('card-pulse-red');
      }, 450);

      if (t2Lives <= 0) {
        setTimeout(() => {
          alert("You have run out of attempts! Task 2 will start anew.");
          resetCurrentTask();
        }, 500);
      } else {
        renderTask();
      }
    }
  }

  function handleT3Choice(choice) {
    const item = task3Deck[t3Index];
    if (choice === item.answer) {
      t3Index++;
      renderTask();
    } else {
      // MISTAKE HANDLER FOR TASK 3
      t3Lives--;
      const appCard = document.getElementById('app-card');
      document.body.classList.add('flash-red');
      appCard.classList.add('card-pulse-red');

      setTimeout(() => {
        document.body.classList.remove('flash-red');
        appCard.classList.remove('card-pulse-red');
      }, 450);

      if (t3Lives <= 0) {
        setTimeout(() => {
          alert("You have run out of attempts! Task 3 will start anew.");
          resetCurrentTask();
        }, 500);
      } else {
        const recycledItem = { ...item, shuffledOptions: null };
        task3Deck.push(recycledItem);
        t3Index++;
        renderTask();
      }
    }
  }

  function handleT4Choice(choice) {
    const item = task4Deck[t4Index];
    const isCorrect = choice === item.correct;
    const appCard = document.getElementById('app-card');
    const expCard = document.getElementById('t4-explanation');

    if (isCorrect) {
      document.body.classList.add('flash-green');
      appCard.classList.add('card-pulse-green');

      setTimeout(() => {
        document.body.classList.remove('flash-green');
        appCard.classList.remove('card-pulse-green');
        t4Index++;
        renderTask();
      }, 450);
    } else {
      // MISTAKE HANDLER FOR TASK 4
      t4Lives--;
      document.body.classList.add('flash-red');
      appCard.classList.add('card-pulse-red');
      
      expCard.innerText = `${item.explanation} (This sentence will be recycled for practice).`;
      expCard.style.display = 'block';

      if (t4Lives <= 0) {
        setTimeout(() => {
          alert("You have run out of attempts! Task 4 will start anew.");
          resetCurrentTask();
        }, 800);
      } else {
        const recycledItem = { ...item, btnOrder: null };
        task4Deck.push(recycledItem);

        setTimeout(() => {
          document.body.classList.remove('flash-red');
          appCard.classList.remove('card-pulse-red');
          
          setTimeout(() => {
            t4Index++;
            renderTask();
          }, 1800);
        }, 450);
      }
    }
  }

  function toggleSample() {
    const card = document.getElementById('sample-card');
    card.style.display = card.style.display === 'block' ? 'none' : 'block';
  }

  function handleT5Next() {
    t5Index++;
    renderTask();
  }

  function renderFruitScreen() {
    updateProgressUI();
    const container = document.getElementById('task-container');
    container.innerHTML = `
      <div class="finale-card">
        <h2 class="task-title">Mastery Achieved!</h2>
        <img src="https://images.unsplash.com/photo-1552664730-d307ca884978?auto=format&fit=crop&w=800&q=80" alt="Achievement Accomplished" class="finale-img" />
        <p class="task-instruction">You've successfully cultivated your vocabulary from a seed to full executive mastery!</p>
        <div class="finale-quote">
          "Congratulations! By mastering these essential phrasal verbs, you can smoothly kick off any presentation, map out complex ideas with total clarity, and talk through solutions effortlessly. A strong start guarantees outstanding results, and you have everything it takes to command the room!"
        </div>
      </div>
    `;
  }

  // Initialize Welcome Screen
  renderTask();
</script>

</body>
</html>
